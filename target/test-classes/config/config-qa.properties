# ============================================================================
# config-qa.properties -- QA ENVIRONMENT
# Loaded when: mvn clean test  (default, no -Denv flag needed)
#          or: mvn clean test -Denv=qa
#
# Contains all environment-specific values: URLs, credentials, service URIs.
# Properties here override config.properties for the same key.
# ============================================================================

# -- Environment Identifier --------------------------------------------------
env                      = qa

# -- Application URLs --------------------------------------------------------
app.ui.url               = https://testing.qaautomationlabs.com/
#https://practicetestautomation.com/practice-test-login/
app.api.base.uri         = https://jsonplaceholder.typicode.com

# -- Microservice URIs -------------------------------------------------------
api.user.service.uri     = https://jsonplaceholder.typicode.com
api.post.service.uri     = https://jsonplaceholder.typicode.com
api.comment.service.uri  = https://jsonplaceholder.typicode.com
api.album.service.uri    = https://jsonplaceholder.typicode.com
api.todo.service.uri     = https://jsonplaceholder.typicode.com
api.apirestful.service.uri = https://api.restful-api.dev
api.gorest.service.uri = https://gorest.co.in/public/v2
api.trello.service.uri = https://api.trello.com/1

# -- QA Credentials ---------------------------------------------------------
ui.username              = student
ui.password              = Password123
