# ============================================================================
# config-staging.properties -- STAGING ENVIRONMENT
# Loaded when: mvn clean test -Denv=staging
#
# Contains all environment-specific values for the staging environment.
# In a real project, these URLs would point to actual staging servers.
# For demo purposes, they still point to publicly available test sites.
# ============================================================================

# -- Environment Identifier --------------------------------------------------
env                      = staging

# -- Application URLs --------------------------------------------------------
app.ui.url               = https://practicetestautomation.com/practice-test-login/
app.api.base.uri         = https://jsonplaceholder.typicode.com

# -- Microservice URIs -------------------------------------------------------
# In a real staging environment, each service would have a different host:
#   api.user.service.uri    = https://staging-user-svc.internal:8081
#   api.post.service.uri    = https://staging-post-svc.internal:8082
#   api.comment.service.uri = https://staging-comment-svc.internal:8083
#   api.album.service.uri   = https://staging-album-svc.internal:8084
#   api.todo.service.uri    = https://staging-todo-svc.internal:8085
# For demo, all point to JSONPlaceholder:
api.user.service.uri     = https://jsonplaceholder.typicode.com
api.post.service.uri     = https://jsonplaceholder.typicode.com
api.comment.service.uri  = https://jsonplaceholder.typicode.com
api.album.service.uri    = https://jsonplaceholder.typicode.com
api.todo.service.uri     = https://jsonplaceholder.typicode.com

# -- Staging Credentials -----------------------------------------------------
# In real staging, these would differ from QA credentials.
# For demo, same credentials since both hit the same test site.
ui.username              = student
ui.password              = Password123

# -- Staging-Specific Overrides ----------------------------------------------
# Staging is typically slower than QA, so increase timeouts.
# These override the values from config.properties (common defaults).
timeout.implicit         = 10
timeout.explicit         = 20
timeout.pageload         = 45
