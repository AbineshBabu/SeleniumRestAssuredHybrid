name: API Tests
on:
  push:
    branches:
      - main

jobs:
  api-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run API Tests
        env:
          TRELLO_API_KEY: ${{secrets.TRELLO_API_KEY}}
          TRELLO_TOKEN:  ${{secrets.TRELLO_TOKEN}}
        run: mvn clean test "-Dcucumber.filter.tags=@api"