# ============================================================================
# config.properties -- SHARED / COMMON DEFAULTS
# These apply to ALL environments. Environment-specific files override
# only the properties that differ (URLs, credentials, service URIs).
#
# This file is loaded AFTER config-${env}.properties in the @Sources chain,
# so any property already found in the env file will NOT be overridden by
# this file. Only properties NOT present in the env file are read from here.
# ============================================================================

# -- Browser (same across all environments) ----------------------------------
browser                  = chrome
browser.headless         = false
browser.remote           = false
grid.url                 = http://localhost:4444/wd/hub

# -- Timeouts (same across all environments) ---------------------------------
timeout.implicit         = 5
timeout.explicit         = 15
timeout.pageload         = 30

# -- Reporting (same across all environments) --------------------------------
screenshot.on.failure    = true
screenshot.on.pass       = false

# -- API Timeouts (same across all environments) -----------------------------
api.connection.timeout   = 10000
api.read.timeout         = 20000
